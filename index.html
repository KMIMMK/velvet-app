function showModal(title,body,confirm,callback){modal={title,body,confirm,callback};render()}

ol"><button class="mode ${cfg.mode==='four'?'active':''}" data-action="mode" data-value="four"><strong>🂠 Sexy Cards</strong><span>Vier kaarten</span></button><button class="mode ${cfg.mode==='bingo'?'active':''}" data-action="mode" data-value="bingo"><strong>▦ Sexy Bingo</strong><span>16 vakjes</span></button></div><div class="field"><label>Start Level</label><select data-field="start">${LEVELS.map(([title],i)=>`<option value="${i+1}" ${cfg.start===i+1?'selected':''}>${i+1} — ${title}</option>`).join('')}</select></div><h3>Rondes per level, per persoon</h3>${LEVELS.map(([title],i)=>`<div class="row between" style="margin:10px 0"><div class="grow"><strong>${i+1}. ${title}</strong><div class="small">${i+1<cfg.start?'Wordt overgeslagen':'Kaarten per persoon'}</div></div><button class="btn sm alt icon" data-action="roundChange" data-index="${i}" data-delta="-1">−</button><strong style="min-width:24px;text-align:center">${cfg.rounds[i]}</strong><button class="btn sm alt icon" data-action="roundChange" data-index="${i}" data-delta="1">+</button></div>`).join('')}<p class="small">Totaal: ${cfg.rounds.slice(cfg.start-1).reduce((a,b)=>a+b,0)} kaarten per persoon (${cfg.rounds.slice(cfg.start-1).reduce((a,b)=>a+b,0)*2} samen) vanaf level ${cfg.start}.</p></section><button class="btn block" data-action="start">Start spel →</button><footer>${tasks.length} eigen kaarten beschikbaar · Geen ingebouwde kaarten</footer>`}
function settings(){return `${head('Kaartbeheer')}<button class="btn sm alt" data-action="home">← Beginscherm</button><h1>Settings</h1><div class="panel"><h3>Toegangscode</h3><p class="small">Wijzig de viercijferige PIN. De standaardcode is 0001.</p><form id="pinChange"><div class="field"><label>Huidige PIN</label><input type="password" name="oldPin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="off"></div><div class="field"><label>Nieuwe PIN</label><input type="password" name="newPin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="off"></div><button class="btn alt block" type="submit">PIN wijzigen</button></form></div><div class="panel"><strong>${tasks.length} kaarten opgeslagen</strong><p class="small">Kaarten blijven zo mogelijk lokaal op dit toestel bewaard. Maak regelmatig een JSON-back-up.</p><label class="lbl" for="jsonfile">Privé-JSON met kaarten importeren</label><input id="jsonfile" type="file" accept=".json,application/json" style="width:100%;font-size:14px"><p class="small">Importeer je kaarten lokaal op dit apparaat. Upload dit privébestand niet naar GitHub. Importeren vervangt de huidige kaartenset na bevestiging.</p><button class="btn alt block" data-action="export">↓ Exporteer JSON-back-up</button><button class="btn block" data-action="newCard">+ Nieuwe kaart toevoegen</button></div><div class="panel"><h3>Kaarten bewerken</h3><input type="text" data-field="search" value="${esc(editQuery)}" placeholder="Zoek in kaarten"><div class="field"><select data-field="filter"><option value="">Alle levels</option>${LEVELS.map(([,],i)=>`<option value="${i+1}" ${editFilter===String(i+1)?'selected':''}>Level ${i+1}</option>`).join('')}</select></div><div class="cardslist">${tasks.map((t,i)=>({t,i})).filter(({t})=>(!editFilter||String(t.level)===editFilter)&&(!editQuery||(String(t.template)+' '+String(t.answer||'')).toLowerCase().includes(editQuery.toLowerCase()))).slice(0,300).map(({t,i})=>`<div class="list function editor(){const t=editorId===null?{type:'task',level:1,template:'',performer_body_type:'any',receiver_body_type:'any',kinks:[],time_in_seconds:null}:tasks[editorId];return `${head('Kaart bewerken')}<button class="btn sm alt" data-action="settings">← Kaarten</button><h1>${editorId===null?'Nieuwe kaart':'Kaart bewerken'}</h1><form id="cardForm" class="panel" novalidate><div class="field"><label>Soort</label><select name="type"><option value="task" ${t.type==='task'?'selected':''}>Taak</option><option value="question" ${t.type==='question'?'selected':''}>Vraag</option></select></div><div class="field"><label>Level</label><select name="level">${LEVELS.map(([,],i)=>`<option value="${i+1}" ${Number(t.level)===i+1?'selected':''}>${i+1} — ${LEVELS[i][0]}</option>`).join('')}</select></div><div class="field"><label>Opdracht / vraag</label><textarea name="template" required>${esc(t.template)}</textarea></div><div class="field"><label>Antwoord (optioneel, alleen voor vragen)</label><textarea name="answer" placeholder="Vul hier het antwoord in. Leeg laten voor een gewone open vraag.">${esc(t.answer||'')}</textarea><p class="small">Bij vragen met een antwoord verschijnt tijdens het spel een wazig antwoordvak met een onthulknop.</p></div><div class="field"><label>Uitvoerder</label><select name="performer">${bodyOptions(t.performer_body_type)}</select></div><div class="field"><label>Ontvanger</label><select name="receiver">${bodyOptions(t.receiver_body_type)}</select></div><div class="field"><label>Timer</label><select name="timer">${[["","Geen timer"],[10,'10 seconden'],[30,'30 seconden'],[60,'1 minuut'],[120,'2 minuten']].map(([v,l])=>`<option value="${v}" ${String(t.time_in_seconds??'')===String(v)?'selected':''}>${l}</option>`).join('')}</select></div><div class="lbl">Kinks (meerdere mogelijk)</div><div class="kinkrow head"><span>Categorie</span><span>Actief</span></div>${K.map(([id,label])=>`<div class="kinkrow" style="grid-template-columns:1fr 65px"><span>${label}</span><input type="checkbox" name="kink" value="${id}" ${t.kinks?.includes(id)?'checked':''}></div>`).join('')}<button class="btn block" type="button" data-action="saveCard">Bewaar kaart</button>${t.type==='question'&&t.answer?'<button class="btn alt block" type="button" data-action="previewEditorAnswer">Test antwoord</button>':''}${editorId!==null?'<button type="button" class="btn danger block" data-action="deleteCard">Verwijder kaart</button>':''}</form>`}
function bodyOptions(current){return [['any','Iedereen'],['has_penis','Man'],['has_vagina','Vrouw']].map(([v,l])=>`<option value="${v}" ${current===v?'selected':''}>${l}</option>`).join('')}
function rules(){const isBingo=cfg.mode==='bingo',total=cfg.rounds.slice(cfg.start-1).reduce((a,b)=>a+b,0);return `${head('Spelregels',true)}<div class="centerpage"><h1>${isBingo?'Sexy Bingo':'Sexy Cards'}</h1><div class="panel"><p><strong>${esc(name(0))} &amp; ${esc(name(1))}</strong>, zijn jullie klaar voor een intiem avontuur?</p><h3>The Basics</h3><p>${isBingo?'De speler die aan de beurt is drukt op de dobbelsteen. Je lot wordt bepaald en een kaart wordt getrokken. Lees de opdracht of vraag hardop, en voer deze uit. Je partner besluit of het goed is uitgevoerd.':'De speler die aan de beurt is kiest een van de 4 kaarten. Lees de opdracht of vraag hardop, en voer deze uit. Je partner besluit of het goed is uitgevoerd.'}</p><h3>Timer</h3><p>Bij een opdracht met tijdslimiet start je zelf de klok. Zonder timer kun je meteen beoordelen.</p><h3>Punten</h3><p>🔥 Goed uitgevoerd: <strong>+1</strong><br>❄️ Niet goed uitgevoerd: <strong>−1</strong><br>🐔 Chicken Out: <strong>−2</strong></p><h3>Levels</h3><p>Je speelt ${total} rondes per persoon (${total*2} kaarten samen), verdeeld over ${cfg.start===1?'level 1 t/m 5':`level ${cfg.start} t/m 5`}.</p>${isBingo?'<p><strong>Halen jullie het einde?</strong></p>':''}</div><button class="btn block" data-action="rulesNext">Verder naar level ${cfg.start} →</button></div>`}
function intro(){const copy=LEVEL_COPY[level-1];return `${head('Levelintroductie',true)}<div class="centerpage center level-intro"><div class="level-kicker">VELVET · ${esc(copy[0])}</div><div class="levelball">${level}</div><div class="subtitle">LEVEL ${level}</div><h1 style="font-size:40px">${LEVELS[level-1][0]}</h1><h2 class="muted">${LEVELS[level-1][1]}</h2><p class="level-quote">${esc(copy[1])}</p>${heatMeter()}<p class="small">${cfg.rounds[level-1]} rondes per persoon · ${cfg.rounds[level-1]*2} kaarten samen</p><div class="spacer"></div><button class="btn block" data-action="introNext">Speel level ${level} →</button></div>`}
function finalScreen(){const tie=scores[0]===scores[1],winner=tie?'Gelijkspel!':`${esc(name(scores[0]>scores[1]?0:1))} 🔥`;const bits=['✦','♥','✧','✦','♥','✧','♥','✦','✧','♥','✦','♥'];return `${head('Eindscore')}<div class="centerpage center final-stage"><div class="confetti" aria-hidden="true">${bits.map((b,i)=>`<span style="--x:${(i*37+9)%95}%;--s:${15+(i%4)*5}px;--t:${3+(i%5)}s;--d:-${i*.7}s">${b}</span>`).join('')}</div><div class="final-crown">🏆</div><div class="level-kicker">THE FINAL VERDICT</div><h1>And the winner is…</h1><h2 class="final-winner">${winner}</h2><div class="score"><div class="final-score">${esc(name(0))}<b>${scores[0]}</b>punten</div><div class="final-score">${esc(name(1))}<b>${scores[1]}</b>punten</div></div><p style="color:var(--heat-soft);font-style:italic">${["The game is over. The night isn’t… 🔥","You’ve reached Wild. What happens next is up to you…","Some things are better played together…"][Math.floor(Math.random()*3)]}</p><button class="btn block" data-action="playAgain">Play again ↻</button></div>`}
function getBody(p){return p.body==='man'?'has_penis':'has_vagina'}
function compatible(t,player){const performer=cfg.players[player],receiver=cfg.players[1-player];if(t.performer_body_type&&t.performer_body_type!=='any'&&t.performer_body_type!==getBody(performer))return false;if(t.receiver_body_type&&t.receiver_body_type!=='any'&&t.receiver_body_type!==getBody(receiver))return false;const ks=Array.isArray(t.kinks)?t.kinks:[];if(!ks.length)return true;return ks.some(k=>performer.allow[k]?.give&&receiver.allow[k]?.receive)}
function pool(player,type){return tasks.filter(t=>Number(t.level)===level&&(!type||t.type===type)&&compatible(t,player))}
function choose(player,type,exclude=[]){let all=pool(player,type).filter(t=>!exclude.includes(t.id));let available=all.filter(t=>!used.has(t.id));if(!available.length)available=all;if(!available.length)return null;return available[Math.floor(Math.random()*available.length)]}
function fillBoard(){board=[];const n=cfg.mode==='bingo'?16:4;for(let i=0;i<n;i++){let desired=cfg.mode==='bingo'?(i%3===1?'question':'task'):null;let t=choose(turn,desired,board.filter(Boolean).map(x=>x.id))||choose(turn,null,board.filter(Boolean).map(x=>x.id));board.push(t)}selected=-1;phase='pick';answerRevealed=false}
function currentCard(){return board[selected]}
function answerPanel(t){if(t?.type!=='question'||!String(t.answer||'').trim())return '';return `<div class="answer-panel"><div class="small">ANTWOORD</div><div class="answer-copy ${answerRevealed?'':'concealed'}" aria-label="${answerRevealed?'Antwoord':'Verborgen antwoord'}">${esc(t.answer)}</div><button class="btn alt block" data-action="toggleAnswer" aria-expanded="${answerRevealed}">${answerRevealed?'◉ Verberg antwoord':'◉ Onthul antwoord'}</button></div>`}
function answerPreview(){const t=tasks[previewIndex];return `${head('Antwoord testen')}<button class="btn sm alt" data-action="settings">← Kaartbeheer</button><h1>Voorbeeld vraagkaart</h1><div class="taskbox"><div class="small">VRAAG · LEVEL ${t?.level||1}</div><div class="tasktext">${esc(t?.template||'')}</div></div>${answerPanel(t)}<p class="small center">Dit is alleen een voorbeeld. Je spelvoortgang en punten veranderen niet.</p>`}
function game(){const label=cfg.mode==='bingo'?'Sexy Bingo':'Sexy Cards',isBingo=cfg.mode==='bingo';let main='';if(phase==='pick'||phase==='rolling'||phase==='chosen'){main=`<h2 class="center">${esc(name(turn))} is aan de beurt</h2>${round%3===2?`<div class="turn-tease">${esc(name(turn))}, ${TEASE[Math.floor(round/3)%TEASE.length]}</div>`:""}<p class="small center">${phase==='chosen'?'Tik op het gemarkeerde vakje om de kaart te openen':isBingo?'Druk op de knop voor een trekking':'Kies één van de vier kaarten'}</p><div class="board ${isBingo?'bingo':'four'}">${board.map((t,i)=>`<button class="tile ${selected===i?'focus':''}" data-action="tile" data-index="${i}" ${phase==='rolling'||(isBingo&&phase==='pick')||(phase==='chosen'&&selected!==i)?'disabled':''}><span class="symbol">${(t?.type==='question'||(!t&&((i*7+level*3)%5<2)))?'?':'♥'}</span>${t?(t.type==='question'?'Vraag':'Taak'):((i*7+level*3)%5<2?'Vraag':'Taak')}</button>`).join('')}</div>${isBingo?`<button class="btn block" data-action="roll" ${phase==='rolling'||phase==='chosen'?'disabled':''}>🎲 ${phase==='rolling'?'Trekking bezig…':'Gooi de dobbelsteen'}</button>`:''}`}
else if(phase==='open'||phase==='timer'||phase==='judge'){const t=currentCard();main=`<div class="center small">${t?.type==='question'?'Vraag':'Taak'}</div><div class="taskbox flip-in"><div class="card-performer">${esc(name(turn)).toLocaleUpperCase('nl-NL')}:</div><div class="small">LEVEL ${level} — ${LEVELS[level-1][0]}</div><div class="tasktext">${esc(t?.template||'Geen geschikte kaart')}</div></div>${answerPanel(t)}${phase==='open'&&t?.time_in_seconds?`<p class="center muted">Tijdslimiet: ${t.time_in_seconds} seconden</p><button class="btn block" data-action="startTimer">▶ Start timer</button>`:''}${phase==='timer'?`<div class="timer" id="clock">${formatTime(clockLeft)}</div><p class="small center">De klok stopt automatisch bij 0.</p><button class="btn alt block" data-action="finishTimer">Opdracht afronden</button>`:''}${phase==='judge'||(phase==='open'&&!t?.time_in_seconds)?`<div class="panel"><div class="card-performer center">${esc(name(1-turn)).toLocaleUpperCase('nl-NL')}:</div><h3 class="center">${t?.type==='question'?`Beoordeel: is de vraag door ${esc(name(turn))} goed beantwoord?`:`Beoordeel: heeft ${esc(name(turn))} de opdracht goed uitgevoerd?`}</h3><button class="btn good block" data-action="judge" data-value="1">🔥 ${t?.type==='question'?'Goed beantwoord':'Goed uitgevoerd'} (+1)</button><button class="btn bad block" data-action="judge" data-value="-1">❄️ ${t?.type==='question'?'Niet goed beantwoord':'Niet goed uitgevoerd'} (−1)</button></div>`:''}<div class="skiparea"><div class="small">Wil je deze kaart niet uitvoeren?</div><button class="btn outline sm" data-action="skip">🐔 Chicken Out (−2)</button></div>`}
return `${head(`${label} · Level ${level}`,true)}<div class="row between"><strong>Level ${level} — ${LEVELS[level-1][0]}</strong><span class="small">Kaart ${Math.floor(round/2)+1} / ${cfg.rounds[level-1]} per persoon</span></div><div class="progress"><div style="width:${Math.min(100,round/(cfg.rounds[level-1]*2)*100)}%"></div></div>${`<div class="level-track">${[1,2,3,4,5].map(n=>`<span class="${n<=level?'passed':''}">${n}</span>`).join('')}</div>`}${heatMeter()}<div class="score"><div class="${turn===0?'current':''}">${esc(name(0))}<b>${scores[0]}</b>punten</div><div class="${turn===1?'current':''}">${esc(name(1))}<b>${scores[1]}</b>punten</div></div>${main}`}
function formatTime(n){n=Math.max(0,n);return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function newGame(){if(!tasks.length){screen='settings';toast('Importeer eerst je privé-JSON met kaarten via Settings.');return}stopTimers();scores=[0,0];level=cfg.start;turn=0;round=0;used=new Set();board=[];selected=-1;phase='pick';answerRevealed=false;screen='rules';render()}
function enterLevel(){fillBoard();screen='game';render()}
function endTurn(delta){answerRevealed=false;stopTimers();const actor=name(turn);scores[turn]+=delta;const card=currentCard();if(card)used.add(card.id);round++;turn=1-turn;if(round>=cfg.rounds[level-1]*2){if(level===5){screen='final'}else{level++;round=0;screen='intro'};showResult(delta,actor);return}if(cfg.mode==='four'){fillBoard()}else{const excluded=board.filter((x,i)=>i!==selected&&x).map(t=>t.id);board[selected]=choose(turn,card?.type,excluded)||choose(turn,null,excluded);selected=-1;phase='pick';if(!board.some(Boolean))fillBoard()}showResult(delta,actor)}
function startTimer(){const t=currentCard();clockLeft=Number(t?.time_in_seconds)||0;clockEnd=Date.now()+clockLeft*1000;phase='timer';render();clockTimer=setInterval(()=>{clockLeft=Math.max(0,Math.ceil((clockEnd-Date.now())/1000));const el=$('#clock');if(el)el.textContent=formatTime(clockLeft);if(clockLeft<=0){clearInterval(clockTimer);clockTimer=null;phase='judge';render()}},150)}
function roll(){if(phase!=='pick')return;phase='rolling';let ticks=0,last=-1;render();const max=23;const step=()=>{ticks++;let next=Math.floor(Math.random()*board.length);if(next===last)next=(next+1)%board.length;last=next;selected=next;app.querySelectorAll('.tile').forEach((b,i)=>{b.classList.toggle('focus',i===selected);b.classList.toggle('roulette',i===selected)});if(ticks>=max){rollTimer=null;phase='chosen';if(!board[selected]){const indexes=board.map((t,i)=>t?i:-1).filter(i=>i>=0);selected=indexes.length?indexes[Math.floor(Math.random()*indexes.length)]:-1}render();return}const ratio=ticks/max;const delay=ratio<.35?65:Math.round(65+260*Math.pow((ratio-.35)/.65,2));rollTimer=setTimeout(step,delay)};rollTimer=setTimeout(step,90)}
function exportJson(){if(!confirm('Deze JSON-back-up bevat je kaartteksten als leesbare tekst. Bewaar het bestand privé. Doorgaan met exporteren?'))return;const d={version:1,exportedAt:new Date().toISOString(),tasks};const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Velvet_kaarten.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function importJson(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!Array.isArray(d.tasks)||!d.tasks.every(t=>t&&typeof t.template==='string'&&[1,2,3,4,5].includes(Number(t.level))))throw Error('Dit is geen geldig Velvet JSON-bestand met tasks.');showModal('Kaarten vervangen?',`Je importeert ${d.tasks.length} kaarten. De huidige ${tasks.length} kaarten worden vervangen. Exporteer eerst een back-up als je eigen wijzigingen wilt bewaren.`,'Ja, importeren',()=>{tasks=d.tasks.map(t=>({...t,id:String(t.id||cryptoId()),kinks:Array.isArray(t.kinks)?t.kinks:[]}));persist();screen='settings';toast(`${tasks.length} kaarten geïmporteerd.`)})}catch(e){toast(`Import mislukt: ${e.message}`)}};reader.readAsText(file)}
function cryptoId(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
app.addEventListener('change',e=>{const el=e.target;if(el.id==='jsonfile'){importJson(el.files[0]);return}if(el.dataset.kink){cfg.players[kinkPlayer].allow[el.dataset.kink][el.dataset.role]=el.checked;saveCfg();return}if(el.dataset.field==='name'){cfg.players[Number(el.dataset.player)].name=el.value;saveCfg();return}if(el.dataset.field==='body'){cfg.players[Number(el.dataset.player)].body=el.value;saveCfg();return}if(el.dataset.field==='start'){cfg.start=Number(el.value);saveCfg();render();return}if(el.dataset.field==='filter'){editFilter=el.value;render();return}});
app.addEventListener('input',e=>{if(e.target.dataset.field==='search'){editQuery=e.target.value;const start=e.target.selectionStart;render();const el=app.querySelector('[data-field=search]');el.focus();el.setSelectionRange(start,start)}if(e.target.dataset.field==='name'){cfg.players[Number(e.target.dataset.player)].name=e.target.value;saveCfg()}});
app.addEventListener('submit',e=>{if(!unlocked)return;if(e.target.id==='pinChange'){e.preventDefault();const f=new FormData(e.target);if(f.get('oldPin')!==pinValue()){toast('Huidige PIN is onjuist.');return}const next=String(f.get('newPin'));if(!/^\d{4}$/.test(next)){toast('Gebruik precies vier cijfers.');return}try{localStorage.setItem(PIN_KEY,next);toast('PIN gewijzigd.')}catch(err){toast('PIN kan op dit toestel niet worden opgeslagen.')}return}if(e.target.id!=='cardForm')return;e.preventDefault();saveCard();return;});
function saveCard(){const form=app.querySelector('#cardForm');if(!form)return;const f=new FormData(form),now=new Date().toISOString();const old=editorId===null?null:tasks[editorId];const t={id:old?.id||cryptoId(),type:f.get('type'),level:Number(f.get('level')),template:String(f.get('template')).trim(),performer_body_type:f.get('performer'),receiver_body_type:f.get('receiver'),kinks:f.getAll('kink'),time_in_seconds:f.get('timer')?Number(f.get('timer')):null,answer:f.get('type')==='question'?String(f.get('answer')||'').trim():'',createdAt:old?.createdAt||now,updatedAt:now,is_custom:true};if(!t.template){toast('Vul eerst de kaarttekst in.');return}if(editorId===null){tasks.push(t);editorId=tasks.length-1}else tasks[editorId]=t;persist();screen='editor';render();toast(t.type==='question'&&t.answer?'Vraag en antwoord bewaard. Test antwoord staat hieronder.':'Kaart bewaard.')}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(!unlocked){if(a==='pinDigit')pinInput(b.dataset.value);return}switch(a){case 'lock':lock();break;case 'landing':screen='landing';render();break;case 'selectExperience':cfg.mode=b.dataset.mode==='bingo'?'bingo':'four';saveCfg();screen='home';render();break;case 'home':screen='home';render();break;case 'settings':screen='settings';render();break;case 'kinkPlayer':kinkPlayer=Number(b.dataset.index);render();break;case 'allKinks':for(let [id] of K){cfg.players[kinkPlayer].allow[id]={give:b.dataset.value==='1',receive:b.dataset.value==='1'}}saveCfg();render();break;case 'mode':cfg.mode=b.dataset.value;saveCfg();render();break;case 'roundChange':{const i=Number(b.dataset.index);cfg.rounds[i]=Math.max(1,Math.min(100,cfg.rounds[i]+Number(b.dataset.delta)));saveCfg();render();break}case 'start':if(!cfg.players.every(p=>p.name.trim())){toast('Vul voor beide spelers een naam in.');return}if(!tasks.length){toast('Importeer of voeg eerst kaarten toe.');return}newGame();break;case 'rulesNext':level=cfg.start;screen='intro';render();break;case 'introNext':enterLevel();break;case 'quit':showModal('Spel beëindigen?','Je keert terug naar het beginscherm. De huidige punten en spelvoortgang gaan verloren.','Ja, spel beëindigen',()=>{stopTimers();screen='home';render()});break;case 'modalCancel':modal=null;render();break;case 'modalConfirm':{const fn=modal.callback;modal=null;fn();break}case 'tile':{const i=Number(b.dataset.index);if(!board[i])return;if(cfg.mode==='bingo'&&phase!=='chosen')return;if(phase==='chosen'&&i!==selected)return;if(phase!=='pick'&&phase!=='chosen')return;selected=i;answerRevealed=false;phase='open';render();break}case 'roll':roll();break;case 'toggleAnswer':answerRevealed=!answerRevealed;render();break;case 'previewAnswer':previewIndex=Number(b.dataset.index);answerRevealed=false;screen='answerPreview';render();break;case 'previewEditorAnswer':if(editorId!==null){previewIndex=editorId;answerRevealed=false;screen='answerPreview';render()}break;case 'startTimer':startTimer();break;case 'finishTimer':stopTimers();phase='judge';render();break;case 'judge':endTurn(Number(b.dataset.value));break;case 'skip':showModal('Chicken Out?',`${name(turn)} krijgt 2 minpunten. Weet je zeker dat je deze kaart wilt overslaan?`,'Ja, Chicken Out (−2)',()=>endTurn(-2));break;case 'playAgain':stopTimers();screen='home';render();break;case 'saveCard':saveCard();break;case 'newCard':editorId=null;screen='editor';render();break;case 'editCard':editorId=Number(b.dataset.index);screen='editor';render();break;case 'deleteCard':showModal('Kaart verwijderen?','Deze kaart wordt definitief uit je lokale kaartenset verwijderd.','Ja, verwijderen',()=>{tasks.splice(editorId,1);persist();screen='settings';render()});break;case 'export':exportJson();break;}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&unlocked)lock()});window.addEventListener('pagehide',()=>{if(unlocked)lock()});render();})();
</script></body></html>
